name: Recover document jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: recover-document-jobs
  cancel-in-progress: false

jobs:
  recover:
    if: vars.PRODUCTION_WEB_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
      INGEST_CRON_SECRET: ${{ secrets.INGEST_CRON_SECRET }}
    steps:
      - name: Recover one pending document
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PRODUCTION_WEB_URL" != https://* || -z "$INGEST_CRON_SECRET" ]]; then
            echo "::error::Configure HTTPS PRODUCTION_WEB_URL and INGEST_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 310 \
            --request POST \
            --header "Authorization: Bearer $INGEST_CRON_SECRET" \
            "${PRODUCTION_WEB_URL%/}/api/internal/ingest"
